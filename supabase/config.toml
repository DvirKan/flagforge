# Supabase CLI configuration. Used by `supabase link` / `supabase db push`.
# The [auth] values describe the intended setup; on the hosted project they are set in the dashboard
# (see docs/SUPABASE.md) — this file does not change the hosted project unless you run `supabase config push`.
project_id = "flagforge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
minimum_password_length = 8
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
